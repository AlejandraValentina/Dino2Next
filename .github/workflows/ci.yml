name: foundation-ci
on: [push, pull_request]
jobs:
  pr-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install -r requirements/foundation.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: npm --prefix frontend ci --ignore-scripts
      - run: python scripts/run_gate.py PR_FAST
      - name: Require operational readiness PASS
        id: readiness
        run: python scripts/check_scopes.py --readiness --report artifacts/readiness.json
      - name: Preserve readiness result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-readiness
          path: artifacts/readiness.json
          if-no-files-found: error

  thermo-representation-bcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r research/bcr_s03_nasa_inversion/requirements.txt
      - run: python research/bcr_s03_nasa_inversion/generate.py --check
      - run: python research/bcr_s03_nasa_inversion/checks.py --check
