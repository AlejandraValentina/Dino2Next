name: foundation-ci
on: [push, pull_request]
jobs:
  pr-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install -r requirements/foundation.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: npm --prefix frontend ci --ignore-scripts
      - run: python scripts/run_gate.py PR_FAST
      - name: Record standalone operational readiness (not a foundation PASS claim)
        id: readiness
        continue-on-error: true
        run: python scripts/check_scopes.py --readiness --report artifacts/readiness.json
      - name: Preserve readiness result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-readiness
          path: artifacts/readiness.json
          if-no-files-found: error
      - name: Enforce recorded readiness state
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/readiness.json').read_text())
          issues = json.loads(Path('implementation/readiness_issues.json').read_text())['issues']
          opened = [i for i in issues if i['status'] != 'CLOSED']
          expected = 'FAIL' if opened else 'PASS'
          assert result['result'] == expected, result
          if opened:
              assert 'MISSING_PREIMPLEMENTATION_SCIENTIFIC_DECISION' in result.get('reason', ''), result
              print('Operational readiness FAIL: documented preimplementation decisions remain. Foundation checks are separate.')
          PY
